name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Novo push no mesmo ref cancela o run anterior (economiza minutos e evita
# resultado velho competindo com o novo).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Privilégio mínimo: o CI só lê o código.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Fonte única da versão do Node (local e CI).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # O script typecheck roda `next typegen` antes do tsc: layout.tsx usa o tipo
      # global LayoutProps<"/">, gerado em .next/types, que não existe em checkout limpo.
      - run: npm run typecheck

      - run: npm test

      # next/font/google baixa as fontes durante o build (runner tem rede).
      - run: npm run build

  # OPCIONAL para quem avalia localmente: o E2E (Playwright) não entra no `verify` nem no
  # `npm test`. Aqui roda como job separado para não atrasar nem bloquear o feedback rápido.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cache dos navegadores, chaveado pela versão do Playwright travada no lockfile.
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # O webServer do playwright.config.ts faz build + start.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
